{% extends "base.html" %}
{% block title %}Edit Attendance{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4 mt-4">
            <h3 class="mb-4 text-center">Edit Attendance</h3>
            <form method="POST">
                <input type="hidden" name="subject_id" value="{{ request.args.get('subject_id') }}">
                <div class="mb-3">
                    <label class="form-label">Student</label>
                    <input type="text" class="form-control" value="{{ record.student.first_name }} {{ record.student.last_name }}" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">Date & Time</label>
                    <input type="text" class="form-control" value="{{ record.timestamp.strftime('%Y-%m-%d %I:%M %p') }}" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="Present" {% if record.status == 'Present' %}selected{% endif %}>Present</option>
                        <option value="Logged Out" {% if record.status == 'Logged Out' %}selected{% endif %}>Logged Out</option>
                        <option value="Absent" {% if record.status == 'Absent' %}selected{% endif %}>Absent</option>
                    </select>
                </div>
                <div class="d-grid">
                    <button class="btn btn-success" type="submit">Update</button>
                </div>
            </form>
            <a class="btn btn-link mt-3" href="{{ url_for('routes.attendance_panel') }}">Back to Attendance Panel</a>
        </div>
    </div>
</div>
{% endblock %}
