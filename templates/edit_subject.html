{% extends "base.html" %}
{% block title %}Edit Subject{% endblock %}
{% block content %}
<h2>Edit Subject</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Subject Name</label>
        <input type="text" name="name" class="form-control" value="{{ subject.name }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Professor</label>
        <select name="professor_id" class="form-select">
            <option value="">-- No Professor --</option>
            {% for prof in professors %}
            <option value="{{ prof.id }}" {% if subject.professor_id == prof.id %}selected{% endif %}>{{ prof.username }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-success">Update</button>
    <a href="{{ url_for('routes.manage_subjects') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
